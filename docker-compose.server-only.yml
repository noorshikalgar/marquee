services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      PORT: 8787
      HOST: 0.0.0.0
      DB_PATH: ./data/movie-scout.db
      NOTIFICATION_CRON: ${NOTIFICATION_CRON:-0 9 * * *}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      # No bundled frontend/nginx here — this is a bare API server for desktop
      # (Tauri) clients and/or a separately-hosted frontend. Include every origin
      # that will call this server: your desktop app's webview origin(s)
      # (tauri://localhost on macOS/Linux, https://tauri.localhost on Windows)
      # and any web frontend origin, comma-separated.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "${BACKEND_PORT:-8787}:8787"
    volumes:
      - movie-scout-data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  movie-scout-data:
